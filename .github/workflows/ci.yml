name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check pg eval seed tests data
      - run: pytest -q
      - name: Secret scan
        run: |
          ! git grep -nE "(sk-ant-|sk-[A-Za-z0-9]{20,}|mongodb\+srv://[^<\"]+:[^<\"]+@)" -- . ':!*.md' ':!.env.example'
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm --prefix ui ci
      - run: npx --prefix ui tsc --noEmit -p ui
      - run: npm --prefix ui run build
  deploy:
    needs: [test]
    # Disabled by the combined plan (D17: no extra services). Remove `false &&` only if the team decides to deploy.
    if: false && github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy proofgate --source . --region ${{ vars.GCP_REGION || 'us-central1' }} --project ${{ vars.GCP_PROJECT }} \
            --allow-unauthenticated --min-instances 1 \
            --set-secrets MONGODB_URI=MONGODB_URI:latest,AGENT_SERVICE_KEY=AGENT_SERVICE_KEY:latest \
            --set-env-vars DB_NAME=proofgate,RUN_BACKGROUND=1

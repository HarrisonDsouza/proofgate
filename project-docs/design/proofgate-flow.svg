<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proofgate-flow-title proofgate-flow-desc" id="proofgate-flow-root">
        <title id="proofgate-flow-title">How ProofGate stops an unreviewed denial</title>
        <desc id="proofgate-flow-desc">An AI agent proposes a claim denial, a human reviewer approves it after server-timed evidence review, and one MongoDB Atlas transaction checks the approval and issues a single-use grant that the claims system must consume; a change-stream detector suspends rubber-stamping reviewers and a compensation worker reopens their executed denials, while an examiner rebuilds any case from stored documents.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #proofgate-flow-root { --color-paper: #f3efe4;
      --color-ink: #1b1a17;
      --color-muted: #6f6a5e;
      --color-accent: #0f6e74;
      --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, monospace; }
      #proofgate-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #proofgate-flow-root .lede { color: var(--color-muted); margin-bottom: 1.5rem; max-width: 70ch; }
      #proofgate-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#proofgate-flow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="proofgate-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6f6a5e"/></marker>
          <marker id="proofgate-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f6e74"/></marker>
          <marker id="proofgate-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9b2c1c"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f3efe4"/>

        <!-- Atlas trust boundary -->
        <rect x="520" y="88" width="264" height="472" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-opacity="0.55" stroke-dasharray="4,3"/>
        <text x="536" y="112" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.6" fill="#6f6a5e">MONGODB ATLAS</text>

        <!-- ===== Arrows first ===== -->
        <!-- 1 agent -> reviewer -->
        <line x1="184" y1="176" x2="278" y2="176" stroke="#6f6a5e" stroke-width="1.25" marker-end="url(#proofgate-flow-arrow)"/>
        <rect x="196" y="148" width="72" height="16" fill="#f3efe4"/>
        <text x="232" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e" letter-spacing="0.8">PROPOSAL</text>

        <!-- 2 reviewer -> gate -->
        <line x1="448" y1="176" x2="546" y2="176" stroke="#6f6a5e" stroke-width="1.25" marker-end="url(#proofgate-flow-arrow)"/>
        <rect x="460" y="148" width="72" height="16" fill="#f3efe4"/>
        <text x="496" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e" letter-spacing="0.8">APPROVAL</text>

        <!-- 3 gate -> claims (grant, focal path) -->
        <line x1="756" y1="168" x2="878" y2="168" stroke="#0f6e74" stroke-width="1.75" marker-end="url(#proofgate-flow-arrow-accent)"/>
        <rect x="768" y="140" width="100" height="16" fill="#f3efe4"/>
        <text x="818" y="152" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500" fill="#0f6e74" letter-spacing="0.8">1-USE GRANT</text>

        <!-- 4 claims -> gate read-back (dashed return) -->
        <line x1="880" y1="200" x2="758" y2="200" stroke="#6f6a5e" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#proofgate-flow-arrow)"/>
        <rect x="778" y="212" width="80" height="16" fill="#fbf9f3"/>
        <text x="818" y="224" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e" letter-spacing="0.8">READ-BACK</text>

        <!-- 5 gate -> detector (change stream) -->
        <line x1="652" y1="216" x2="652" y2="298" stroke="#6f6a5e" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#proofgate-flow-arrow)"/>
        <rect x="662" y="248" width="104" height="16" fill="#fbf9f3"/>
        <text x="666" y="260" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e" letter-spacing="0.8">CHANGE STREAM</text>

        <!-- 6 detector -> compensation (suspend) -->
        <line x1="652" y1="380" x2="652" y2="446" stroke="#9b2c1c" stroke-width="1.25" marker-end="url(#proofgate-flow-arrow-link)"/>
        <rect x="662" y="404" width="64" height="16" fill="#fbf9f3"/>
        <text x="666" y="416" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9b2c1c" letter-spacing="0.8">SUSPEND</text>

        <!-- 7 compensation -> claims (reopen) -->
        <path d="M756 488 H1044 Q1052 488 1052 480 V218" fill="none" stroke="#9b2c1c" stroke-width="1.25" marker-end="url(#proofgate-flow-arrow-link)"/>
        <rect x="868" y="460" width="64" height="16" fill="#f3efe4"/>
        <text x="900" y="472" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9b2c1c" letter-spacing="0.8">REOPEN</text>

        <!-- 8 examiner reads Atlas -->
        <line x1="448" y1="488" x2="518" y2="488" stroke="#6f6a5e" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#proofgate-flow-arrow)"/>
        <rect x="456" y="460" width="56" height="16" fill="#f3efe4"/>
        <text x="484" y="472" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e" letter-spacing="0.8">READS</text>

        <!-- ===== Nodes ===== -->
        <!-- AI agent -->
        <rect x="32" y="136" width="152" height="80" rx="6" fill="#f3efe4"/>
        <rect x="32" y="136" width="152" height="80" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-width="1"/>
        <rect x="44" y="148" width="48" height="16" rx="2" fill="none" stroke="#6f6a5e" stroke-width="0.8"/>
        <text x="68" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6f6a5e" letter-spacing="0.8">AGENT</text>
        <text x="44" y="188" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">AI agent</text>
        <text x="44" y="204" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">proposes denials</text>

        <!-- Reviewer -->
        <rect x="280" y="136" width="168" height="80" rx="6" fill="#f3efe4"/>
        <rect x="280" y="136" width="168" height="80" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-width="1"/>
        <rect x="292" y="148" width="48" height="16" rx="2" fill="none" stroke="#6f6a5e" stroke-width="0.8"/>
        <text x="316" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6f6a5e" letter-spacing="0.8">HUMAN</text>
        <text x="292" y="188" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">Reviewer</text>
        <text x="292" y="204" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">opens cited evidence</text>

        <!-- Gate (focal) -->
        <rect x="548" y="136" width="208" height="80" rx="6" fill="#f3efe4"/>
        <rect x="548" y="136" width="208" height="80" rx="6" fill="#dcebe8" stroke="#0f6e74" stroke-width="1.75"/>
        <rect x="560" y="148" width="92" height="16" rx="2" fill="none" stroke="#0f6e74" stroke-width="0.8"/>
        <text x="606" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#0f6e74" letter-spacing="0.8">TRANSACTION</text>
        <text x="560" y="188" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">ProofGate gate</text>
        <text x="560" y="204" font-family="IBM Plex Mono, monospace" font-size="10" fill="#0f6e74">checks G1–G8, mints grant</text>

        <!-- Claims system -->
        <rect x="880" y="136" width="200" height="80" rx="6" fill="#f3efe4"/>
        <rect x="880" y="136" width="200" height="80" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-width="1"/>
        <rect x="892" y="148" width="56" height="16" rx="2" fill="none" stroke="#6f6a5e" stroke-width="0.8"/>
        <text x="920" y="160" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6f6a5e" letter-spacing="0.8">TARGET</text>
        <text x="892" y="188" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">Claims system</text>
        <text x="892" y="204" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">changes only with a grant</text>

        <!-- Detector -->
        <rect x="548" y="300" width="208" height="80" rx="6" fill="#fbf9f3"/>
        <rect x="548" y="300" width="208" height="80" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-width="1"/>
        <rect x="560" y="312" width="64" height="16" rx="2" fill="none" stroke="#6f6a5e" stroke-width="0.8"/>
        <text x="592" y="324" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6f6a5e" letter-spacing="0.8">WATCHER</text>
        <text x="560" y="352" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">Detector</text>
        <text x="560" y="368" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">rate · median · CUSUM</text>

        <!-- Compensation -->
        <rect x="548" y="448" width="208" height="80" rx="6" fill="#fbf9f3"/>
        <rect x="548" y="448" width="208" height="80" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-width="1"/>
        <rect x="560" y="460" width="56" height="16" rx="2" fill="none" stroke="#6f6a5e" stroke-width="0.8"/>
        <text x="588" y="472" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6f6a5e" letter-spacing="0.8">WORKER</text>
        <text x="560" y="500" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">Compensation</text>
        <text x="560" y="516" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">reopens, then reads back</text>

        <!-- Examiner -->
        <rect x="280" y="448" width="168" height="80" rx="6" fill="#f3efe4"/>
        <rect x="280" y="448" width="168" height="80" rx="6" fill="#fbf9f3" stroke="#1b1a17" stroke-width="1"/>
        <rect x="292" y="460" width="48" height="16" rx="2" fill="none" stroke="#6f6a5e" stroke-width="0.8"/>
        <text x="316" y="472" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6f6a5e" letter-spacing="0.8">AUDIT</text>
        <text x="292" y="500" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="#1b1a17">Examiner</text>
        <text x="292" y="516" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">rebuilds any case</text>

        <!-- Callouts -->
        <text x="280" y="248" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#1b1a17">Dwell is timed by the server:</text>
        <text x="280" y="266" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#1b1a17">view tokens and heartbeats.</text>
        <text x="836" y="248" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#9b2c1c">No valid grant: 403,</text>
        <text x="836" y="266" font-family="Fraunces, Georgia, serif" font-style="italic" font-size="14" fill="#9b2c1c">logged, record unchanged.</text>

        <!-- Legend strip -->
        <line x1="32" y1="604" x2="1088" y2="604" stroke="#1b1a17" stroke-opacity="0.16"/>
        <line x1="32" y1="636" x2="72" y2="636" stroke="#0f6e74" stroke-width="1.75" marker-end="url(#proofgate-flow-arrow-accent)"/>
        <text x="84" y="640" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">GRANT PATH</text>
        <line x1="200" y1="636" x2="240" y2="636" stroke="#6f6a5e" stroke-width="1.25" marker-end="url(#proofgate-flow-arrow)"/>
        <text x="252" y="640" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">REQUEST</text>
        <line x1="348" y1="636" x2="388" y2="636" stroke="#6f6a5e" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#proofgate-flow-arrow)"/>
        <text x="400" y="640" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">READ / OBSERVE</text>
        <line x1="532" y1="636" x2="572" y2="636" stroke="#9b2c1c" stroke-width="1.25" marker-end="url(#proofgate-flow-arrow-link)"/>
        <text x="584" y="640" font-family="IBM Plex Mono, monospace" font-size="10" fill="#9b2c1c">SUSPEND AND REOPEN</text>
        <rect x="748" y="628" width="24" height="16" rx="3" fill="#fbf9f3" stroke="#1b1a17" stroke-opacity="0.55" stroke-dasharray="4,3"/>
        <text x="784" y="640" font-family="IBM Plex Mono, monospace" font-size="10" fill="#6f6a5e">ATLAS BOUNDARY</text>
      </svg>

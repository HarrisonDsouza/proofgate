<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProofGate (fallback console)</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaf0;--quiet:#9aa3b2;--line:#2a2f3a;--red:#ef5b5b;--green:#3ecf8e;--blue:#6aa9ff;--amber:#f2a93b}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}h1{font-size:16px;margin:0 12px 0 0}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}.primary{background:var(--blue);color:#081020;border-color:var(--blue)}.danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
main{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;padding:16px}@media(max-width:900px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}h2{font-size:12px;margin:0 0 10px;color:var(--quiet);text-transform:uppercase;letter-spacing:.05em}
.q{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}.q:hover{border-color:var(--blue)}
.banner{padding:12px;border-radius:8px;font-weight:600;margin-bottom:12px;display:none}.bad{background:#ef5b5b22;border:1px solid var(--red)}.good{background:#3ecf8e1a;border:1px solid var(--green)}
.ev{border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}.ev.open{border-color:var(--amber)}.meter{color:var(--quiet);font:12px ui-monospace,monospace}
pre{white-space:pre-wrap;font:12px ui-monospace,monospace;color:var(--quiet);max-height:420px;overflow:auto}textarea{width:100%}
</style></head><body>
<header><h1>ProofGate</h1>
<label>Tenant <input id="tenant" value="payer-acme" size="11"></label>
<label>Reviewer <select id="who"><option>dr-demo</option><option>vol-1</option><option>vol-2</option><option>vol-3</option><option>dr-stamper</option><option>dr-skim</option><option>dr-expired</option><option>dr-cardio</option><option>op-ops-1</option></select></label>
<button id="login" class="primary">Start session</button><span id="sess" class="meter"></span>
<button id="bulk" class="danger">Select all, approve 50</button></header>
<main><div>
<div id="banner" class="banner"></div>
<section><h2>Queue (agent-proposed denials)</h2><div id="queue"></div></section>
<section><h2>Supervisor</h2><div id="dash" class="meter"></div>
<div style="margin-top:8px"><input id="floor" size="6" value="60"> s floor <button id="setfloor">New policy version</button>
<button id="halt">Halt reviewer</button></div></section></div>
<div><section><h2>Case</h2><div id="case" class="meter">Pick a case. Open each cited evidence item; the server times it.</div>
<textarea id="att" rows="2">I reviewed the cited evidence for this case.</textarea>
<div style="margin-top:8px"><button id="approve" class="primary">Approve denial</button></div><div id="res" class="meter"></div></section>
<section><h2>Examiner replay</h2><input id="excase" placeholder="CLM-A-0001"><button id="ex">Rebuild case</button><pre id="exout"></pre></section></div></main>
<script>
const $=s=>document.querySelector(s);let S=null,P=null,TOK=null,lastInput=Date.now(),hbTimer=null;
const H=()=>({'content-type':'application/json','X-Tenant-Id':$('#tenant').value,...(S?{'X-Session-Id':S}:{})});
const api=(p,b)=>fetch(p,b?{method:'POST',headers:H(),body:JSON.stringify(b)}:{headers:H()}).then(r=>r.json());
['mousemove','keydown','scroll','click'].forEach(e=>addEventListener(e,()=>lastInput=Date.now()));
function banner(t,ok){const b=$('#banner');b.style.display='block';b.className='banner '+(ok?'good':'bad');b.textContent=t}
async function dash(){const d=await api('/api/dashboard');$('#dash').textContent=`executed ${d.executed} · reversed ${d.reversed} · refused ${d.refused} · pending ${d.pending} · suspended: ${d.suspended_reviewers.join(', ')||'none'}`}
async function loadQueue(){const q=await api('/api/queue');window.Q=q;$('#queue').innerHTML=q.slice(0,12).map(p=>`<div class="q" onclick="pick('${p.proposal_id}')"><b>${p.case_id}</b> ${p.summary}<br><span class="meter">${p.rationale}</span></div>`).join('')||'<span class="meter">empty</span>';dash()}
$('#login').onclick=async()=>{const r=await api('/api/sessions',{tenant_id:$('#tenant').value,reviewer_id:$('#who').value});S=r.session_id;$('#sess').textContent=`${S} · ${r.reviewer.specialty}`;loadQueue()};
window.pick=id=>{P=Q.find(p=>p.proposal_id===id);$('#case').innerHTML=`<b>${P.case_id}</b> · ${P.summary}<br>${P.rationale}<br>codes ${P.codes.icd10.join(',')} / ${P.codes.hcpcs.join(',')} · $${P.billed_amount}`+P.all_evidence.map(e=>`<div class="ev" id="ev-${e.evidence_id}"><button onclick="openEv('${e.evidence_id}')">Open ${e.evidence_id}</button> ${e.label}${P.cited_evidence.some(c=>c.evidence_id===e.evidence_id)?' <b>(cited)</b>':''}<div class="meter" id="c-${e.evidence_id}"></div></div>`).join('')};
window.openEv=async eid=>{const r=await fetch(`/api/cases/${P.case_id}/evidence/${eid}`,{headers:H()}).then(r=>r.json());TOK=r.view_token;document.querySelectorAll('.ev').forEach(x=>x.classList.remove('open'));$('#ev-'+eid).classList.add('open');$('#c-'+eid).textContent=r.content;
 clearInterval(hbTimer);hbTimer=setInterval(async()=>{const h=await api(`/api/views/${TOK}/heartbeat`,{visible:document.visibilityState==='visible',interacted_within_ms:Date.now()-lastInput});$('#c-'+eid).dataset.t=h.active_ms;$('#res').textContent=`${eid}: server-credited ${(h.active_ms/1000).toFixed(1)} s active, ${(h.idle_ms/1000).toFixed(1)} s idle`},5000)};
$('#approve').onclick=async()=>{clearInterval(hbTimer);const a=await api('/api/approvals',{proposal_id:P.proposal_id,attestation_text:$('#att').value,dwell_ms:45000});
 const r=await api('/api/agent/run-once');banner(r.executed?`Executed ${r.executed} of ${r.submitted} · read back from the claims system`:`Executed 0 of ${r.submitted} · ${Object.entries(r.top_reasons).map(([k,v])=>k+' '+v).join(' · ')}`,!!r.executed);
 $('#res').textContent=`server dwell ${(a.active_dwell_ms/1000).toFixed(1)} s · client dwell_ms ignored: ${JSON.stringify(a.client_supplied_ignored)}`;$('#excase').value=P.case_id;loadQueue()};
$('#bulk').onclick=async()=>{const ids=(await api('/api/queue?limit=50')).map(p=>p.proposal_id);await api('/api/approvals/bulk',{proposal_ids:ids,attestation_text:'Reviewed in batch.'});
 const r=await api('/api/agent/run-once');const d=await api('/api/dashboard');banner(`Executed: ${r.executed} of ${r.submitted} · ${Object.entries(r.top_reasons).map(([k,v])=>k+' '+v).join(' · ')} · Suspended: ${d.suspended_reviewers.join(', ')||'none'}`,false);loadQueue()};
$('#setfloor').onclick=async()=>{const r=await api('/api/policies',{action_type:'claim_denial',rules:{min_active_dwell_ms:+$('#floor').value*1000},rationale:'Raised floor live in the demo'});banner(`Policy v${r.version} active (was v${r.superseded_version}). The next gate call reads it.`,true)};
$('#halt').onclick=async()=>{const r=await api('/api/suspensions',{reviewer_id:$('#who').value,reason:'SUPERVISOR_HALT'});banner(`Suspended ${$('#who').value}: ${r.grants_revoked} grants revoked, ${r.proposals_requeued} requeued, ${r.compensations_created} denials to reopen`,false);dash()};
$('#ex').onclick=async()=>{const r=await api('/api/examiner/cases/'+$('#excase').value);$('#exout').textContent=JSON.stringify({proposal:r.proposal&&{agent:r.proposal.agent_id,rationale:r.proposal.rationale},views:r.views,approval:r.approval&&{reviewer:r.approval.reviewer_id,dwell_ms:r.approval.active_dwell_ms,ignored:r.approval.client_supplied_ignored},gate:r.gate_decisions.map(g=>({decision:g.decision,policy_version:g.policy_version,attempts:g.txn_attempts,failed:g.checks.filter(c=>!c.pass).map(c=>c.rule+': '+c.detail)})),denial:r.denial&&{status:r.denial.status,readback:r.denial.readback},target_log:r.target_log.map(t=>t.op+' '+t.outcome+' by '+t.caller),suspension:r.suspension&&{rule:r.suspension.rule,source:r.suspension.source},compensation:r.compensation&&r.compensation.status,chain:r.chain},null,2)};
setInterval(()=>{if(S)dash()},3000);
</script></body></html>
